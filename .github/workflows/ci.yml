name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint

      # Las pruebas de integración de la API y las de RLS corren contra un Postgres real: la pila
      # local de Supabase con solo lo necesario (la base y GoTrue, que crea el esquema `auth`).
      # `start` aplica las migraciones y el seed. Descarga las imágenes: tarda unos minutos.
      - name: Levantar Supabase local (base de datos y auth)
        run: >
          pnpm exec supabase start -x
          realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: pnpm test:db
      - run: pnpm test
      - run: pnpm build

  go:
    name: Go (vet, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/erp-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/erp-agent/go.mod
          cache-dependency-path: packages/erp-agent/go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Archivos sin formatear con gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
